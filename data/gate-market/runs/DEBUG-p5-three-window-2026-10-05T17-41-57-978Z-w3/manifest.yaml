windowCount: 3
instrument:
  id: single-issuer-per-window
  description: One serving issuer in window 1 (F1), enforcement against an issuer
    that cannot serve in windows 2 and 3. ISSUER-B is registered first and
    ISSUER-A second, both lots bonded at deploy; after window 1 the operator
    drains ISSUER-B so later windows route to ISSUER-A. One issuer per window is
    configuration in this record, never code.
  deploymentFile: data/deployments/base-sepolia-gate-market-single-issuer.json
  topology:
    lotCreationOrder:
      - ISSUER-B
      - ISSUER-A
    expectedIssuerByWindow:
      "1": ISSUER-B
      "2": ISSUER-A
      "3": ISSUER-A
    drain:
      afterWindow: 1
      issuer: ISSUER-B
      classId: code
      datedTo: run_end
    routeAfterDrain: ISSUER-A
sellerFeeAsymmetry:
  usdcRouteEscrowFeeBps: 50
  fsiuRouteFeeBps: 0
  chargedTo: seller
  sellersCanSteerAssetOfAQuote: false
  note: "The dollar route's escrow fee comes out of the seller's proceeds and the
    fSIU route has none. That is a seller-side difference and not a buyer's
    cost: price parity is a statement about what the payer pays. Sellers cannot
    steer which asset a quote is settled in — a seller decides only whether to
    sign the buyer's own request — so the asymmetry cannot bias what buyers do,
    and it is recorded and not equalised."
instrumentChanges:
  - "payment_symmetry: pay_with_claim settles a seller-issued quote, like pay
    (2026-10-04)"
  - "passed_requires_testing_purchase: passed = gate passed AND testing paid for
    AND carried out (2026-10-04)"
  - "claims_have_positions: a claim is tracked per holder — what each holds,
    presents and is served — so one passed on in part, or two in one window, are
    no longer one slot overwritten (2026-10-05)"
  - "empty_at_token_budget_is_retried_once: a completion that ends at the token
    limit with no text is retried once and, if it recurs, the run is
    infrastructure-failed and excluded (2026-10-05)"
