    validateModelAssignment — WORKER-CODE/WORKER-EXTRACT distinct families
    (anthropic/google), ORCHESTRATOR+both workers span 3 families
    (openai/anthropic/google), ISSUER-A/ISSUER-B capacityModel differ
    (xai/google). Re-run and re-confirmed 2026-09-26 after restoring
