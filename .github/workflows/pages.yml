name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Separate from ci.yml deliberately: a site deploy shouldn't gate on, or be gated by, the
# Solidity suite / contract coverage job, and a deploy failure shouldn't fail PR checks.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Root build runs every workspace package in topological order (see ci.yml's own comment
      # on this), so site's dependencies (@touchstone/sdk, @touchstone/print) are already built
      # by the time site's own build script runs and generates site/public/.
      - name: Build
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
