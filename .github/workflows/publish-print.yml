name: Publish print

# Separate from ci.yml deliberately: this workflow spends real money and writes a permanent
# signed, anchored record. It should never be gated on, or gate, the JS/Solidity test suite — a
# broken lint rule in an unrelated PR must never block today's print, and a bad print must never
# be masked as a green CI run. (Site publication no longer has its own workflow here — it moved
# to Cloudflare Pages' own git integration, which redeploys on push independently of GitHub
# Actions; the old pages.yml / GitHub Pages configuration was retired once that was confirmed.)
#
# Schedule enabled 2026-08-24, after a clean workflow_dispatch dry run (print 2026-08-24: Dated
# SIU 0.0014, $0.0949 cost, anchored, independently verified, committed by github-actions[bot]).
#
# Two cron entries, one workflow: the second isn't a separate mechanism, it's the retry policy
# (docs/methodology.md's Index governance) — one automated same-day retry before a missed day is
# declared, never a second one. Nothing in this file's own logic distinguishes "first attempt"
# from "retry": publish-unattended.ts's own pre-flight (already published → no-op) and its
# same-day-retry detection (an incident already on disk for this print_id → this is that retry,
# with the day's remaining spend ceiling and prior_attempts disclosure) do all of it. A retry
# firing while the first attempt is still running queues behind it (concurrency, below) rather
# than overlapping.
on:
  schedule:
    - cron: "17 0 * * *" # 00:17 UTC daily — print date and run date always agree.
    - cron: "17 4 * * *" # 04:17 UTC — the one same-day retry, if 00:17 didn't produce a print.
  workflow_dispatch:
    inputs:
      print_id:
        description: "Print ID (defaults to today's UTC date, YYYY-MM-DD)"
        required: false

concurrency:
  group: publish-print
  # Never cancel an in-flight run — it may have already spent real money on inference or sent an
  # anchor transaction. A second trigger queues behind it instead.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Topological build — packages/print, packages/harness etc. must be built before the CLI
      # below can resolve its workspace dependencies' compiled dist/. Same reasoning as ci.yml.
      - name: Build
        run: pnpm run build

      # See ci.yml's identical step: packages/basket's T3 grader refuses to run candidate code
      # without unshare --net sandboxing, which needs unprivileged user namespaces enabled on this
      # runner image. This workflow runs the real harness (including T3), so it needs this too.
      - name: Allow unprivileged user namespaces (needed for T3's unshare --net sandbox)
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Resolve print id
        id: resolve
        env:
          PRINT_ID_INPUT: ${{ inputs.print_id }}
        run: |
          PRINT_ID="$PRINT_ID_INPUT"
          if [ -z "$PRINT_ID" ]; then PRINT_ID=$(date -u +%Y-%m-%d); fi
          echo "print_id=$PRINT_ID" >> "$GITHUB_OUTPUT"

      # No fallback to a committed snapshot on failure, and no continue-on-error — a print dated
      # today built on stale prices is exactly the quiet inaccuracy the evidence hierarchy in
      # docs/methodology.md exists to prevent. If this fails, the job stops here, before the
      # harness spends anything.
      - name: Fetch fresh prices
        run: pnpm --filter @touchstone/prices run fetch:prices

      - name: Publish print (unattended)
        id: publish
        env:
          TOUCHSTONE_PUBLISHER_KEY: ${{ secrets.TOUCHSTONE_PUBLISHER_KEY }}
          TOUCHSTONE_PUBLISHER_ADDRESS: ${{ secrets.TOUCHSTONE_PUBLISHER_ADDRESS }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Frontier adapters (packages/harness/src/adapters/{anthropic,openai,google}.ts) —
          # wired through now so this workflow needs no further change once the registry
          # actually admits a frontier model (docs/methodology.md's registry inclusion policy:
          # admission needs a completed real evidence run first). Harmless to pass unconditionally
          # today: loadApiKeysFromEnv() only reads these, and no adapter is constructed for a
          # provider nothing in data/registry/models.json references yet. Empty/unset secrets
          # resolve to empty strings, not errors.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PUBLISH_SPEND_CEILING_USD: ${{ vars.PUBLISH_SPEND_CEILING_USD }}
          PRINT_ID: ${{ steps.resolve.outputs.print_id }}
        run: |
          set -o pipefail
          # cwd must be packages/print, not the repo root: @touchstone/sdk's loadDeployment (and
          # this package's own repoRoot() in cli/load-inputs.ts) resolve data/ as ../../data
          # relative to process.cwd(), matching pnpm's "scripts run with cwd = the package
          # directory" convention every other CLI here relies on. `pnpm --filter ... exec` sets
          # that cwd for the spawned node process without re-running the build step.
          pnpm --filter @touchstone/print exec node dist/cli/publish-unattended.js "$PRINT_ID" 2>&1 | tee publish.log
          if grep -q "Already published" publish.log; then
            echo "status=noop" >> "$GITHUB_OUTPUT"
          else
            echo "status=published" >> "$GITHUB_OUTPUT"
          fi

      # Independent, from-scratch recomputation check — deliberately separate from publishPrint's
      # own internal validation, run before anything is committed. Skipped on a no-op (nothing new
      # to verify).
      - name: print:verify
        if: steps.publish.outputs.status == 'published'
        env:
          PRINT_ID: ${{ steps.resolve.outputs.print_id }}
        run: pnpm --filter @touchstone/print run verify "$PRINT_ID"

      # Mirrors the spend-ceiling GitHub Actions Variable into a committed file so the read-only
      # operator console (which has no access to Actions Variables) can display the same number
      # without the two disagreeing. Only commits when the value actually changed, so changing the
      # Variable doesn't require a print to have published today for the console to catch up.
      - name: Sync spend ceiling into the repo
        if: steps.publish.outputs.status == 'published'
        env:
          PUBLISH_SPEND_CEILING_USD: ${{ vars.PUBLISH_SPEND_CEILING_USD }}
        run: |
          cat > data/registry/pipeline-config.json <<EOF
          {
            "spend_ceiling_usd": "${PUBLISH_SPEND_CEILING_USD}",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      # This push uses the default GITHUB_TOKEN actions/checkout@v4 wires up — and GitHub
      # deliberately does not let a GITHUB_TOKEN-authored push trigger other push-triggered
      # workflows (infinite-loop prevention), so ci.yml does NOT run against this commit. Known
      # and accepted, not an oversight: this workflow already runs build, compute, sign, anchor
      # and print:verify inline before this step, and an automated commit only ever touches
      # data/ — nothing ci.yml's broader typecheck/lint/contract suite would catch that isn't
      # already covered here. The alternative (a PAT with repo-write scope, stored as a secret,
      # so pushes look user-authored) was declined for the same reason the console's ceiling
      # button was declined: it's credential expansion for a case this workflow already guards.
      # Revisit this if an automated commit ever starts touching code, not just data/.
      - name: Commit and push
        if: steps.publish.outputs.status == 'published'
        env:
          PRINT_ID: ${{ steps.resolve.outputs.print_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A print for this print_id now exists, so any earlier "no print — run failed" incident
          # for the same id (e.g. the scheduled run failed and this is a same-day manual retry)
          # is no longer accurate — sitting next to a real print for that date would mislead, not
          # disclose. Removed in the same commit as the print it's superseded by, not left behind.
          rm -f "data/prints/incidents/$PRINT_ID.json"
          git add data/prints/ "data/runs/$PRINT_ID/" data/registry/
          git commit -m "Publish print $PRINT_ID

          Automated daily run. Cadence and cut-off: docs/methodology.md, Index governance."
          git push origin main

      # A missed day is disclosed on the public site (site/src/data.ts's loadIncidents), not
      # silently absent — the same "the record must tell the truth" principle the supersession
      # and superseded-print disclosures already follow. Deliberately narrow: this only ever
      # writes data/prints/incidents/<print_id>.json, never data/prints/<print_id>.json or
      # data/runs/ — the append-only guard on the print itself is completely untouched by this.
      - name: Record a failed run
        if: always() && job.status == 'failure'
        env:
          PRINT_ID: ${{ steps.resolve.outputs.print_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/prints/incidents
          REASON=$(grep -m1 "^Error:" publish.log 2>/dev/null | sed 's/^Error: //')
          if [ -z "$REASON" ]; then
            REASON="Run failed before publish.log had a diagnostic message — see the linked run's full log."
          fi
          # Per-model/task-class infrastructure-failure breakdown (harness's
          # formatInfraFailureSummary), when the failure was the qualifying-set gate rather than
          # something earlier — makes the disclosure itself self-diagnosing, not just a link to
          # dig through. Captures the summary line plus every indented bucket line that follows
          # it, stopping at the first non-indented line.
          INFRA_BREAKDOWN=$(awk '
            /instance\(s\) had an infrastructure failure and produced no run record:/ { capture=1; print; next }
            capture && /^  / { print; next }
            { capture=0 }
          ' publish.log 2>/dev/null)
          # publish-unattended.ts's own structured line (cli/publish-unattended.ts's catch
          # block) — real qualifying/registered counts and real spend for this attempt, plus
          # this attempt's own prior_attempts if it was itself the same-day retry and also
          # failed. Falls back to null fields if absent (a refusal type that doesn't emit this
          # line yet, or a failure before the harness ran at all).
          ATTEMPT_SUMMARY=$(grep -m1 "^ATTEMPT_SUMMARY " publish.log 2>/dev/null | sed 's/^ATTEMPT_SUMMARY //')
          REASON="$REASON" INFRA_BREAKDOWN="$INFRA_BREAKDOWN" ATTEMPT_SUMMARY="$ATTEMPT_SUMMARY" python3 -c '
          import json, os, datetime
          print_id = os.environ["PRINT_ID"]
          infra_breakdown = os.environ["INFRA_BREAKDOWN"]
          summary_line = os.environ["ATTEMPT_SUMMARY"]
          summary = json.loads(summary_line) if summary_line else {}
          record = {
              "date": print_id,
              "run_url": os.environ["RUN_URL"],
              "reason": os.environ["REASON"],
              "infra_failures": infra_breakdown if infra_breakdown else None,
              "qualifying_models": summary.get("qualifying_models"),
              "registered_models": summary.get("registered_models"),
              "cost_usd": summary.get("cost_usd"),
              "prior_attempts": summary.get("prior_attempts") or None,
              "occurred_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("data/prints/incidents/" + print_id + ".json", "w") as f:
              json.dump(record, f, indent=2)
              f.write("\n")
          '
          git add "data/prints/incidents/${PRINT_ID}.json"
          git commit -m "Record failed print run for ${PRINT_ID}

          Automated. See ${RUN_URL} for the full log."
          git push origin main

      - name: Job summary
        if: always()
        env:
          PRINT_ID: ${{ steps.resolve.outputs.print_id }}
          JOB_STATUS: ${{ job.status }}
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
        run: |
          {
            echo "## Print: $PRINT_ID"
            echo ""
            if [ "$JOB_STATUS" = "success" ] && [ "$PUBLISH_STATUS" = "noop" ]; then
              echo "Already published for this print id — no action taken."
            elif [ "$JOB_STATUS" = "success" ]; then
              echo "Published, verified, and pushed. See publish.log below for the run's own summary."
            else
              echo "**Aborted — nothing was committed.** Check the failed step above for which guard fired (already-published no-op excepted, every other early exit is a real failure: insufficient publisher balance, no RPC configured, price fetch failure, below the minimum qualifying-set size, over the spend ceiling, or a failed anchor)."
            fi
            echo ""
            echo '```'
            cat publish.log 2>/dev/null || echo "(no publish.log — failed before the publish step ran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
