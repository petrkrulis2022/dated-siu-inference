name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole point of this workflow is that a change to packages/contracts cannot pass on a green
# JavaScript suite alone. The TypeScript and Solidity suites use different toolchains, so both
# are installed and both must pass before the run is green.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # packages/contracts/lib is vendored as git submodules (forge-std, openzeppelin-contracts).
          # Without this the Solidity build cannot resolve its imports.
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1

      # GitHub's ubuntu-latest runner image (Ubuntu 24.04) restricts unprivileged user-namespace
      # creation via AppArmor by default — confirmed live, this is what T3's `unshare --net`
      # sandbox already needs this fix for, and gate-market's bubblewrap sandbox needs the
      # identical fix (same underlying kernel restriction, not tool-specific). Runs early,
      # immediately after dependencies are installed and before any build/lint work, so a broken
      # sandbox fails fast rather than after several minutes of unrelated work — this is the one
      # piece of the security claim that's actually unverified until it runs here for real.
      - name: Allow unprivileged user namespaces (needed for T3's unshare and gate-market's bwrap sandboxes)
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # gate-market's sandbox is a security boundary, not a convenience (docs/gate-market-spec.md
      # §2.3: agents are explicitly told to write adversarial code against it) — this step exists
      # so an unavailable sandbox fails here, loudly and distinctly, rather than being buried
      # inside a full test run's output. Same "refuse rather than silently degrade" policy the
      # module itself enforces at runtime (packages/gate-market/src/sandbox/capability.ts) — this
      # is the CI-side half of that guarantee, verified rather than assumed from a local pass.
      - name: Verify the gate-market sandbox actually works on this runner
        run: |
          bwrap --unshare-all --clearenv \
            --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind-try /lib64 /lib64 \
            --proc /proc --dev /dev --die-with-parent -- /bin/true

      # Runs before Typecheck deliberately: every package's `typecheck` is `tsc --noEmit`, which
      # emits nothing, so a downstream package that imports another workspace package (resolved
      # via that package's compiled `dist/*.d.ts`, not its source) cannot type-check until the
      # dependency has actually been built at least once. `pnpm -r run build` runs in topological
      # dependency order and does emit, so by the time a consumer package builds, its workspace
      # dependencies' `dist/` already exists. Confirmed live: every CI run before this one failed
      # at Typecheck for exactly this reason (`site` couldn't resolve `@touchstone/sdk`'s types),
      # reproduced locally by deleting every `dist/` and running `pnpm run typecheck` cold.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        # Three pre-existing documents predate the formatter and are deliberately untouched;
        # this step is expected to report them and is therefore not gating.
        run: pnpm run format
        continue-on-error: true

      - name: README deployments section is in sync with data/deployments/*.json
        # Gating, unlike the general format check: a stale README address is exactly the kind
        # of silent second-source-of-truth drift this generator exists to prevent.
        run: pnpm run docs:deployments:check

      # Runs the TypeScript suite and the Foundry suite. `test:all` chains them with `&&`, so a
      # Solidity failure fails the job even when every JS test passes.
      #
      # BASE_SEPOLIA_RPC_URL is a public endpoint, not a secret — set here (unlike
      # CIRCLE_TESTNET_PRIVATE_KEY/TOUCHSTONE_PUBLISHER_KEY below, which stay unset in CI and leave
      # testnet.live.test.ts skipped) so packages/mcp-server/src/settlement/on-chain.test.ts's
      # read-only live-Base-Sepolia assertions actually run here rather than only locally.
      - name: Test (TypeScript + Solidity)
        env:
          BASE_SEPOLIA_RPC_URL: https://sepolia.base.org
        run: pnpm run test:all

      - name: Contract coverage
        run: forge coverage --root packages/contracts --report summary
